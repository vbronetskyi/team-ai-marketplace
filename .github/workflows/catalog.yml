name: catalog

# Builds site/catalog-index.json from the manifests, READMEs, CHANGELOGs and component
# files, and publishes site/ to GitHub Pages. No backend: the page searches the index.
on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "plugins/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # last-change dates per plugin come from git log
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/build-catalog.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
